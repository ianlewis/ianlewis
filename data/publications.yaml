  - name: "Managing Cross-Team Resources at Scale"
    type: talk
    sessions:
      - event: *the-inaugural-devops-exchange-san-francisco
        date: "2015-11-11T18:30:00-08:00"
        url: "https://www.meetup.com/devops-exchange-sanfrancisco/events/226533979/"
        video: "https://www.youtube.com/watch?v=-L68MpvnV6o"
    abstract: |
      Getting the most out of resources you are paying for can be a challenge.
      Virtualization allowed us to create clusters of machines to run parallel
      workloads easily. But, traditionally, organizations only got about 40%
      utilization out of those clusters. Containerizing those workloads and
      running them with a scheduler like Kubernetes can help you get better
      utilization by running different kinds of workloads together on the same
      cluster. Even still, you will want some control over how many cluster
      resources each of your teams or applications use. In this talk I will help
      explain how to run workloads from multiple teams in the same cluster and
      limit those teams to a certain amount of resources. I will look at what
      happens when clusters run out of resources, and walk through how to debug
      and fix allocation issues. As an added bonus, I will also talk about how
      applications and services can operate across team boundaries.

