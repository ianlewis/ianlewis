  - name: "Kubernetes Security Best Practices"
    type: talk
    date: "2019-12-12T10:30:00+11:00"
    event:
      - name: "Kubernetes Forum Sydney 2019"
        url: "https://events19.linuxfoundation.org/events/kubernetes-forum-sydney-2019/"
    url: "https://k8sforumsydney19.sched.com/event/WKgh/kubernetes-security-best-practices-ian-lewis-google?iframe=yes&w=100%&sidebar=yes&bg=no"
    video: "https://www.youtube.com/watch?v=mhA80viZWgU"
    abstract: |
      Containers give developers the ability to isolate applications from one
      another, but that’s not enough. Resource isolation is much different that
      security isolation. How do we make applications deployed in containers
      more secure? What tools can we apply to our containers running in
      Kubernetes to make them more secure? How can we apply policy to our
      network and services to make sure applications only have access to what
      they need and nothing more?

      In this talk, attendees will learn about the risks and attack surfaces of
      a Kubernetes cluster. We'll look at tools like PodSecurityPolicy,
      SELinux, AppArmor, seccomp, and sandboxed containers in action to improve
      the security of containers. We’ll then go up the stack and learn how to
      apply network policy to containers to further improve security.

