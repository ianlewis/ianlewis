  - name: "Keynote: The Kubernetes Community"
    type: talk
    date: "2017-06-20T16:25:00+08:00"
    event:
      - name: "ContainerCon China 2017"
        url: "https://lc3china2017.sched.com/"
    url: "https://lc3china2017.sched.com/event/ADn7/keynote-the-kubernetes-community-e-ian-lewis-developer-advocate-google"
    video: "https://www.youtube.com/watch?v=cwcvAbwm-R4"
    slides: "https://speakerdeck.com/ianlewis/keynote-the-kubernetes-community"
    abstract: |
      Kubernetes has emerged as a leading container management platform not just
      because of its technical capabilities, but also because of the tremendous
      open-source community that has powered its development. How did Kubernetes
      reach the top 0.01% of all GitHub projects based on stars analysis? In
      this talk, we will describe how the Kubernetes community organizes and
      runs the project, and some of the principles that the community has
      learned over its 2.5 years of rapid growth have been critical to its
      success.

  - name: "The Kubernetes API & Next Generation Automation Tools"
    type: talk
    date: "2017-06-20T13:35:00+08:00"
    event:
      - name: "LinuxCon + ContainerCon + CloudOpen China 2017"
        url: "https://lc3china2017.sched.com/"
    url: "https://lc3china2017.sched.com/event/AVBQ/the-kubernetes-api-next-generation-automation-tools-e-ian-lewis-google-inc"
    abstract: |
      The Kubernetes API provides new ways to build automation tools that are
      highly available and scale to serve clusters with many thousands of nodes.
      During this session attendees will learn how to move beyond shell scripts
      and configuration management tools and leverage cluster level APIs and
      distributed systems design patterns to build next generation automation
      tools. Attendees will learn how to extend the Kubernetes API and utilize
      their own custom declarative configuration to build controllers that
      automate job scheduling or schedulers that allow you to place jobs based
      on your rules.

  - name: "Scheduling and Resource Management in Kubernetes"
    type: talk
    date: "2017-06-20T11:00:00+08:00"
    event:
      - name: "LinuxCon + ContainerCon + CloudOpen China 2017"
        url: "https://lc3china2017.sched.com/"
    url: "https://lc3china2017.sched.com/event/AVBJ/scheduling-and-resource-management-in-kubernetes-e-ian-lewis-google"
    abstract: |
      Effective management of shared resources (CPU, memory, etc.) is critical
      to achieving high utilization and strong isolation in shared clusters.
      This talk will describe the Kubernetes features that allow you to
      simultaneously achieve your utilization, isolation, and availability
      goals. We will also examine the new features in Kubernetes 1.6 that give
      you fine-grained control over placement of your containers, and describe
      how to use them to achieve various concrete policy goals. Lastly we will
      discuss the feature roadmap in this area for the next few releases.

  - name: "Keynote Panel Discussion: The Future is Cloud Native: How Projects Like Kubernetes, Fluentd, OpenTracing, and Linkerd Will Help Shape Modern Infrastructure - Moderated by Chris Aniszczyk, Cloud Native Computing Foundation"
    type: panel
    date: "2017-05-31T09:30:00+09:00"
    event:
      - name: "Open Source Summit Japan 2017"
        url: "https://events17.linuxfoundation.org/events/open-source-summit-japan"
    url: "https://ossjapan2017.sched.com/event/AMSw/keynote-panel-discussion-the-future-is-cloud-native-how-projects-like-kubernetes-fluentd-opentracing-and-linkerd-will-help-shape-modern-infrastructure-moderated-by-chris-aniszczyk-cloud-native-computing-foundation"
    video: "https://www.youtube.com/watch?v=vU8BjJsxXgw"
    abstract: |
      Many of today’s software-defined organizations, like Ticketmaster, ShowMax
      and VSCO, look to cloud native projects for crucial management and
      maintenance within their ever-changing infrastructures. Chris Aniszczyk,
      COO of the Cloud Native Computing Foundation, will moderate an
      introspective panel – featuring cloud native insiders like Keiko Harada,
      Ian Lewis and Eduardo Silva – to discuss how these thriving open source
      projects will help shape modern infrastructure. This expert panel will
      also address what it takes to develop meaningful cloud native systems, how
      these technologies fit into the overall stack, how to foster committed
      maintainers for emerging cloud native projects, and much more.

