  - name: "Kubernetes Security Best Practices"
    type: talk
    date: "2018-05-25T11:50:00+10:00"
    event:
      - name: "Container Camp AU 2018"
        url: "https://2018.container.camp/au/"
    url: "https://2018.container.camp/au/schedule/kubernetes-security-best-practices/"
    video: "https://www.youtube.com/watch?v=v6a37uzFrCw"
    abstract: |
      Kubernetes has become the de-facto orchestration tool but it has some
      pitfalls to keep in mind with regard to security. How can we make
      containers more secure? How do we apply existing tools to our containers?
      How can we apply policy to containers so they only have access to what
      they need and nothing more? In this talk attendees will learn about
      specific security risks and see tools like PodSecurityPolicy,
      SELinux/AppArmor, and seccomp in action to mitigate those risks. Then
      we’ll go up the stack and learn how to apply network policy to containers
      and further improve security.

