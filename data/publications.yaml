  - name: "The Enemy Within: Running Untrusted Code with gVisor"
    type: talk
    date: "2019-06-25T11:00:00+08:00"
    event:
      - name: "Open Source Summit China 2019"
        url: "https://events19.lfasiallc.com/events/kubecon-cloudnativecon-china-2019/"
    url: "https://kccncosschn19eng.sched.com/event/Nrou/the-enemy-within-running-untrusted-code-with-gvisor-ian-lewis-google?iframe=yes&w=100%&sidebar=yes&bg=no"
    video: "https://www.youtube.com/watch?v=1Ib-rfSzDuM"
    abstract: |
      Containers are a great way to isolate application resources but they can
      fall short when it comes to security isolation. How do you improve the
      security of your workloads without giving up the properties of containers
      that you've come to love? There are many approaches to sandboxing
      containers, such as virtual machines and unikernels, but which is right
      for you?

      gVisor is a unique open-source sandbox runtime that allows you to run
      unmodified applications in containers with a higher level of isolation and
      low overhead. In this talk I will explore the container security model of
      gVisor and use cases for sandboxing containers. I will discuss various
      approaches and their tradeoffs before diving into the architecture of
      gVisor and how it differs from virtual machine based sandboxes. Finally, I
      will bring it all together with a demo of a minimal serverless platform
      using gVisor and Kubernetes.

