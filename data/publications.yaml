publications:
  - name: "Least privilege: Move beyond default service accounts"
    type: talk
    sessions:
      - event: *google-cloud-next-2024
        # I'm not sure exactly what day the talk was given.
        date: "2024-04-09"
        video: "https://www.youtube.com/watch?v=sBiZukrBDMo"
    abstract:
      Default service accounts provide the flexibility to get started, but often
      have excess permissions when used in production. How do we find a balance
      between ease of use for developers and the security demands in production
      environments? This session covers the common pitfalls that can occur with
      default service accounts, how to move beyond default service accounts and
      use custom IAM roles to follow the principle of least privilege, and how
      to automate alerts to balance the needs of developers and security teams.

  - name: "Spicing up Container Image Security with SLSA & GUAC"
    type: talk
    sessions:
      - event: *cloudnativesecuritycon-na-2023
        date: "2023-02-02T13:55:00-08:00"
        url: "https://cloudnativesecurityconna23.sched.com/event/1FV3e/spicing-up-container-image-security-with-slsa-guac-ian-lewis-google?iframe=yes&w=100%&sidebar=yes&bg=no"
        video: "https://www.youtube.com/watch?v=32IhwdAe0yI"
        language: en
    abstract: |
      Understanding and verifying the content of images that you deploy in
      production environments is difficult and error prone. Images could be
      built in an insecure environment, by a malicious actor, or include
      dependencies that are insecure. Users often don't have enough information
      to determine if images are trustworthy. Two new tools can help; Supply
      chain Levels for Software Artifacts (SLSA), and Graph for Understanding
      Artifact Composition (GUAC). In this talk attendees will learn how to add
      SLSA provenance metadata to their container images and strongly link
      images back to their source code on multiple build systems including
      GitHub Actions and Google Cloud Build. We will also cover how to verify
      images and their metadata before use; both when running locally and when
      running images in Kubernetes. Using policy engines like Kyverno and
      Sigstore policy-controller we can verify an image's source code
      repository, builder identity, build entry points, and more to protect
      production environments from malicious images. Finally we'll discuss how
      to understand your image's supply chain using GUAC. We'll discuss how we
      can combine SLSA with GUAC to better understand the contents and build
      provenance of your images from the base layers on down.

