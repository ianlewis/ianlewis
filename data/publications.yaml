  - name: "Managing Cross-Team Resources at Scale"
    type: talk
    date: "2015-11-11T18:30:00-08:00"
    event:
      - name: "The Inaugural DevOps Exchange - San Francisco"
        url: "https://www.meetup.com/devops-exchange-sanfrancisco/events/226533979/"
    url: "https://www.meetup.com/devops-exchange-sanfrancisco/events/226533979/"
    video: "https://www.youtube.com/watch?v=-L68MpvnV6o"
    abstract: |
      Getting the most out of resources you are paying for can be a challenge.
      Virtualization allowed us to create clusters of machines to run parallel
      workloads easily. But, traditionally, organizations only got about 40%
      utilization out of those clusters. Containerizing those workloads and
      running them with a scheduler like Kubernetes can help you get better
      utilization by running different kinds of workloads together on the same
      cluster. Even still, you will want some control over how many cluster
      resources each of your teams or applications use. In this talk I will help
      explain how to run workloads from multiple teams in the same cluster and
      limit those teams to a certain amount of resources. I will look at what
      happens when clusters run out of resources, and walk through how to debug
      and fix allocation issues. As an added bonus, I will also talk about how
      applications and services can operate across team boundaries.

  - name: "Building a Scalable Python gRPC Service using Kubernetes"
    type: talk
    date: "2015-08-30T16:00:00+09:00"
    event:
      - name: "PyCon Korea 2015"
        url: "https://2015.pycon.kr/2015/"
    url: "https://2015.pycon.kr/2015/program/52"
    slides: "https://speakerdeck.com/ianlewis/building-a-scalable-python-grpc-service-using-kubernetes-at-pycon-korea"
    video: "https://www.youtube.com/watch?v=weQtfmt35UM"
    abstract: |
      gRPC is a new high performance, open source, general RPC framework that
      uses the HTTP/2 standard. The gRPC framework allows you to create small
      scalable services that fit well into a service oriented architecture.
      Kubernetes is a cluster manager that allows you to create services that
      can be scaled easily. Service oriented architecture is a key part of how
      many companies, like Google, operate their infrastructure to provide
      robust, and highly available services that operate at a consistently high
      level of performance for end users.

      In this talk I will talk about how to use Python to create a scalable gRPC
      service and then how to actually manage and scale it using the Kubernetes
      cluster manager. Using Python allows you to make use of the extensive set
      of Python libraries publicly available. Python is a flexible language that
      can be very efficient when tuned properly.
