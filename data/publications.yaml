  - name: "Deep Learning with Python & TensorFlow"
    type: talk
    sessions:
      - event: *pydata-sg-02-2017
        date: "2017-02-20T20:10:00+08:00"
        url: "https://www.meetup.com/pydata-sg/events/235981769/"
        video: "https://www.youtube.com/watch?v=DsIMvVoMGu0"
      - event: *pycon-sg-2016
        # This could have been on day 1 or day 2.
        date: "2016-06-24"
        video: "https://www.youtube.com/watch?v=U0ACP9J8vOU"
      - event: *pycon-jp-2016
        date: "2016-09-21T13:30:00+09:00"
        url: "https://pycon.jp/2016/en/schedule/presentation/20/index.html"
        video: "https://www.youtube.com/watch?v=y_zKja1p2Ys"
      - event: *pycon-apac-2016
        date: "2016-08-13T12:40:00+09:00"
        url: "https://2016.pycon.kr/2016apac/program/17"
        video: "https://www.youtube.com/watch?v=6js_F4MSCEQ"
      - event: *europython-2016
        date: "2016-07-22T14:00:00+02:00"
        url: "https://ep2016.europython.eu/conference/talks/deep-learning-with-python-tensorflow.html"
        slides: "https://speakerdeck.com/ianlewis/deep-learning-with-python-and-tensorflow"
        video: "https://www.youtube.com/watch?v=yZuxcR8jxlw"
      - event: *pycon-tw-2016
        date: "2016-06-04T13:00:00+08:00"
        url: "https://tw.pycon.org/2016/en-us/events/talk/56874546946375700/"
        video: "https://www.youtube.com/watch?v=L9RRJAYig_I"
    abstract: |
      Python has lots of scientific, data analysis, and machine learning
      libraries. But there are many problems. Which do you use? How do they
      compare to each other? How can you use a model that has been trained in
      your production application?

      TensorFlow is a new Open Source framework created at Google for building
      Deep Learning applications. Tensorflow allows you to construct easy to
      understand data flow graphs which form a mathematical and logical
      pipeline. Creating data flow graphs allow easier visualization of
      complicated algorithms as well as running the training operations over
      multiple hardware GPUs.

      Tensorflow data flow graphs and operations are written in Python. In this
      talk I will discuss how you can use TensorFlow to create Deep Learning
      applications. I will discuss how it compares to other Python machine
      learning libraries like Theano or Chainer. Finally, I will discuss how
      trained TensorFlow models could be deployed into a production system using
      TensorFlow Serve.

