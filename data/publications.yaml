  - name: "Kubernetes Security Best Practices"
    type: talk
    sessions:
      - event: *kubernetes-forum-seoul-2019
        date: "2019-12-09T15:40:00+09:00"
        url: "https://k8sforumseoul19eng.sched.com/event/WIQe/kubernetes-security-best-practices-ian-lewis-google"
        video: "https://www.youtube.com/watch?v=wqsUfvRyYpw"
        language: en
      - event: *kubernetes-forum-sydney-2019
        date: "2019-12-12T10:30:00+11:00"
        url: "https://k8sforumsydney19.sched.com/event/WKgh/kubernetes-security-best-practices-ian-lewis-google?iframe=yes&w=100%&sidebar=yes&bg=no"
        video: "https://www.youtube.com/watch?v=mhA80viZWgU"
        language: en
      - event: *container-camp-au-2018
        date: "2018-05-25T11:50:00+10:00"
        url: "https://2018.container.camp/au/schedule/kubernetes-security-best-practices/"
        video: "https://www.youtube.com/watch?v=v6a37uzFrCw"
        language: en
    abstract: |
      Containers give developers the ability to isolate applications from one
      another, but that’s not enough. Resource isolation is much different that
      security isolation. How do we make applications deployed in containers
      more secure? What tools can we apply to our containers running in
      Kubernetes to make them more secure? How can we apply policy to our
      network and services to make sure applications only have access to what
      they need and nothing more?

      In this talk, attendees will learn about the risks and attack surfaces of
      a Kubernetes cluster. We'll look at tools like PodSecurityPolicy,
      SELinux, AppArmor, seccomp, and sandboxed containers in action to improve
      the security of containers. We’ll then go up the stack and learn how to
      apply network policy to containers to further improve security.

  - name: "The Enemy Within: Running Untrusted Code with gVisor"
    type: talk
    sessions:
      - event: *open-source-summit-china-2019
        date: "2019-06-25T11:00:00+08:00"
        url: "https://kccncosschn19eng.sched.com/event/Nrou/the-enemy-within-running-untrusted-code-with-gvisor-ian-lewis-google?iframe=yes&w=100%&sidebar=yes&bg=no"
        video: "https://www.youtube.com/watch?v=1Ib-rfSzDuM"
        language: en
    abstract: |
      Containers are a great way to isolate application resources but they can
      fall short when it comes to security isolation. How do you improve the
      security of your workloads without giving up the properties of containers
      that you've come to love? There are many approaches to sandboxing
      containers, such as virtual machines and unikernels, but which is right
      for you?

      gVisor is a unique open-source sandbox runtime that allows you to run
      unmodified applications in containers with a higher level of isolation and
      low overhead. In this talk I will explore the container security model of
      gVisor and use cases for sandboxing containers. I will discuss various
      approaches and their tradeoffs before diving into the architecture of
      gVisor and how it differs from virtual machine based sandboxes. Finally, I
      will bring it all together with a demo of a minimal serverless platform
      using gVisor and Kubernetes.

